<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thip Bala</title>
<meta name="description" content="Thip Bala — space, telecom, geospatial, and a few things that are none of those.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<!-- ACT 1 ---------------------------------------------------------- -->
<section id="approach" aria-label="Introduction">
  <div class="sticky">
    <canvas id="frames" aria-hidden="true"></canvas>

    <div id="greeting">hi, im thip.</div>

    <div id="cue">
      <span>SCROLL</span>
      <span class="line"></span>
    </div>
  </div>
</section>

<!-- Outside .sticky on purpose: that element carries the pointer-drift
     transform, and the loading screen is meant to sit perfectly still. -->
<div id="loader">
  <h1><span>hi,</span> <span>im</span> <span>thip.</span></h1>
  <div class="bar" role="progressbar" aria-label="Loading"><i></i></div>
</div>

<div id="grain" aria-hidden="true"></div>

<!-- ACT 2 ---------------------------------------------------------- -->
<div id="chart-stage">
  <svg id="chart" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid meet"
       aria-label="Star chart of experiences">
    <defs>
      <filter id="soften" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>
    <g id="g-frame" class="lyr"></g>
    <g id="g-axes"  class="lyr"></g>
    <g id="g-net"   class="lyr"></g>
    <g id="g-lines" class="lyr"></g>
    <g id="g-field" class="lyr"></g>
    <g id="g-cat"   class="lyr"></g>
    <g id="g-nodes" class="lyr"></g>
  </svg>
</div>

<div id="hint">Ten of these stars are his. Hover one.</div>

<div id="card" role="dialog" aria-live="polite">
  <span class="sid"></span>
  <span class="thumb"></span>
  <div class="pad">
    <h2></h2>
    <p class="desc"></p>
    <div class="meta"></div>
    <ul></ul>
    <button class="more" type="button">Read more</button>
  </div>
</div>

<!-- Full write-up, opened from a card's "Read more". -->
<div id="story" hidden>
  <div class="story-scrim" data-story-close></div>
  <article class="story-panel" role="dialog" aria-modal="true" aria-labelledby="story-title">
    <button class="story-close" type="button" data-story-close aria-label="Close">&times;</button>
    <div class="story-hero"></div>
    <div class="story-body">
      <p class="story-kicker"></p>
      <h2 id="story-title"></h2>
      <div class="story-meta"></div>
      <div class="story-prose"></div>
      <a class="story-link" href="#"></a>
    </div>
  </article>
</div>

<div id="footer">
  <a data-link="email"    href="#">Email</a>
  <a data-link="linkedin" href="#">LinkedIn</a>
  <span class="spacer"></span>
  <a data-link="listview" href="#">All experiences</a>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/frames.manifest.js"></script>
<script src="assets/js/window-track.js"></script>
<script src="assets/js/pointer-drift.js"></script>
<script src="assets/js/scroll-video.js"></script>
<script src="assets/js/story.js"></script>
<script src="assets/js/star-chart.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
